name: Validate engineering models

on:
  push:
    paths:
      - "src/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/validate-models.yml"
  pull_request:
    paths:
      - "src/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/validate-models.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run reference calculations
        run: python src/calculations/reference_model.py

      - name: Run wind-load precheck
        run: >-
          python src/calculations/wind_load_precheck.py
          --csv /tmp/wind-precheck.csv

      - name: Verify generated wind precheck
        run: test -s /tmp/wind-precheck.csv

      - name: Smoke-test periodic shadow model
        run: >-
          python src/simulation/shadow_periodic.py
          --output /tmp/shadow-smoke
          --window 30
          --resolution 1
          --timestep-minutes 30

      - name: Verify generated shadow summary
        run: test -f /tmp/shadow-smoke/summary.csv
