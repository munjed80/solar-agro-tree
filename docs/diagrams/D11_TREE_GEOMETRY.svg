<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#ffffff"/>
  <style>
    .t{font-family:Arial,sans-serif;fill:#111827}.h{font-size:28px;font-weight:700}.s{font-size:18px}.d{stroke:#111827;stroke-width:2;fill:none}.pv{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.col{fill:#e5e7eb;stroke:#374151;stroke-width:2}.dim{stroke:#6b7280;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs>
  <text x="60" y="55" class="t h">D11 Solar Agro Tree — Reference Geometry</text>
  <text x="60" y="88" class="t s">Concept engineering — dimensions require structural validation</text>

  <!-- elevation -->
  <text x="90" y="145" class="t h" font-size="22">Elevation</text>
  <line x1="80" y1="640" x2="545" y2="640" class="d"/>
  <rect x="294" y="300" width="36" height="340" class="col"/>
  <polygon points="120,300 312,145 504,300 312,300" class="pv"/>
  <line x1="120" y1="300" x2="504" y2="300" class="d"/>
  <line x1="312" y1="145" x2="312" y2="300" class="d"/>
  <line x1="95" y1="300" x2="95" y2="640" class="dim"/>
  <text x="105" y="477" class="t s">5.0 m edge height</text>
  <line x1="535" y1="145" x2="535" y2="640" class="dim"/>
  <text x="545" y="405" class="t s">8.0 m apex height</text>
  <line x1="120" y1="670" x2="504" y2="670" class="dim"/>
  <text x="255" y="705" class="t s">11.0 m canopy diameter</text>
  <text x="350" y="365" class="t s">Hollow structural column</text>

  <!-- plan -->
  <text x="680" y="145" class="t h" font-size="22">Plan view</text>
  <polygon points="875,190 1040,285 1040,475 875,570 710,475 710,285" class="pv"/>
  <circle cx="875" cy="380" r="18" class="col"/>
  <line x1="875" y1="380" x2="875" y2="190" class="d"/>
  <line x1="875" y1="380" x2="1040" y2="285" class="d"/>
  <line x1="875" y1="380" x2="1040" y2="475" class="d"/>
  <line x1="875" y1="380" x2="875" y2="570" class="d"/>
  <line x1="875" y1="380" x2="710" y2="475" class="d"/>
  <line x1="875" y1="380" x2="710" y2="285" class="d"/>
  <text x="755" y="620" class="t s">Six inclined PV faces on rail-supported structure</text>
  <text x="755" y="650" class="t s">Approx. inclined surface: 92.9 m²/tree</text>
  <text x="755" y="680" class="t s">Approx. active PV area at 90% coverage: 83.6 m²/tree</text>
</svg>